name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'feature/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: build + test (clone limpo)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Cache do NuGet chaveado pelos .csproj: qualquer mudanca de dependencia invalida o cache.
      - name: Cache de pacotes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore SpotifyDataAnalysis.sln

      # TreatWarningsAsErrors vem do Directory.Build.props e NAO deve ser afrouxado aqui.
      - name: Build (Release, warnings-as-errors)
        run: dotnet build SpotifyDataAnalysis.sln -c Release --no-restore

      # verbosity=normal e obrigatorio: e o que faz cada teste ignorado aparecer nomeado no log,
      # com o motivo do skip (os [PostgresFact]/[CatalogPostgresFact] exigem Postgres real e o
      # [KaggleDatasetFact] exige o dataset.csv gitignored; todos sao pulados de proposito).
      # --logger trx sem LogFileName: cada projeto grava o seu TRX. Com nome fixo, o ultimo projeto
      # sobrescreve os anteriores e os skips deles somem do resumo.
      - name: Test (Release)
        run: >
          dotnet test SpotifyDataAnalysis.sln -c Release --no-build
          --logger "console;verbosity=normal"
          --logger trx
          --results-directory ${{ runner.temp }}/test-results

      # O skip nao pode ficar escondido: este passo lista no stdout do job E no summary quais
      # testes nao executaram e por que, para que "verde" nunca signifique "nao rodou".
      - name: Resumo dos testes ignorados
        if: always()
        shell: bash
        run: |
          RESULTS_DIR="${{ runner.temp }}/test-results"
          # No TRX, testName vem ANTES de outcome em <UnitTestResult>: filtra o elemento e extrai o nome, sem depender da ordem.
          IGNORADOS=$(grep -rhoP --include='*.trx' '<UnitTestResult\b[^>]*>' "$RESULTS_DIR" 2>/dev/null \
            | grep 'outcome="NotExecuted"' | grep -oP '(?<= testName=")[^"]+' \
            | sed -e 's/&quot;/"/g' -e 's/&lt;/</g' -e 's/&gt;/>/g' -e "s/&apos;/'/g" -e 's/&amp;/\&/g' | sort || true)
          TOTAL=$(printf '%s' "$IGNORADOS" | grep -c . || true)
          MOTIVO='[PostgresFact]/[CatalogPostgresFact] requerem Postgres real (ConnectionStrings__SpotifyDb ausente no CI, DP-1 do E6.1); [KaggleDatasetFact] requer o dataset.csv gitignored na raiz.'
          {
            echo "=============================================="
            echo "Testes ignorados: $TOTAL"
            echo "Motivo: $MOTIVO"
            [ -n "$IGNORADOS" ] && printf '%s\n' "$IGNORADOS" | sed 's/^/  - /'
            echo "=============================================="
          } | tee -a "$GITHUB_STEP_SUMMARY"

  frontend:
    name: frontend (typecheck + lint + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias (clone limpo)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
