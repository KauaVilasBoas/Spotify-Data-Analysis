name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'feature/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: build + test (clone limpo)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Cache do NuGet chaveado pelos .csproj: qualquer mudanca de dependencia invalida o cache.
      - name: Cache de pacotes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore SpotifyDataAnalysis.sln

      # TreatWarningsAsErrors vem do Directory.Build.props e NAO deve ser afrouxado aqui.
      - name: Build (Release, warnings-as-errors)
        run: dotnet build SpotifyDataAnalysis.sln -c Release --no-restore

      # verbosity=normal e obrigatorio: e o que faz cada teste ignorado aparecer nomeado no log,
      # com o motivo do skip (os [PostgresFact] exigem Postgres real e sao pulados de proposito).
      - name: Test (Release)
        run: >
          dotnet test SpotifyDataAnalysis.sln -c Release --no-build
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ${{ runner.temp }}/test-results

      # O skip nao pode ficar escondido: este passo lista no stdout do job E no summary quais
      # testes nao executaram e por que, para que "verde" nunca signifique "nao rodou".
      - name: Resumo dos testes ignorados
        if: always()
        shell: bash
        run: |
          RESULTS_DIR="${{ runner.temp }}/test-results"
          IGNORADOS=$(grep -rhoP '(?<=outcome="NotExecuted" testName=")[^"]+' "$RESULTS_DIR" 2>/dev/null | sort || true)
          TOTAL=$(printf '%s' "$IGNORADOS" | grep -c . || true)
          MOTIVO='[PostgresFact] requer Postgres real (variavel ConnectionStrings__SpotifyDb ausente no CI por decisao DP-1 do card E6.1).'
          {
            echo "=============================================="
            echo "Testes ignorados: $TOTAL"
            echo "Motivo: $MOTIVO"
            [ -n "$IGNORADOS" ] && printf '%s\n' "$IGNORADOS" | sed 's/^/  - /'
            echo "=============================================="
          } | tee -a "$GITHUB_STEP_SUMMARY"

  frontend:
    name: frontend (typecheck + lint + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias (clone limpo)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
